file_format: definition/2
attributes:
  - key: sample.state
    type:
      members:
        - id: numeric
          value: 1
          stability: stable
          brief: Numeric.
        - id: textual
          value: one
          stability: stable
          brief: Textual.
    stability: stable
    brief: Synthetic state.
metrics:
  - name: sample_count
    instrument: counter
    unit: '1'
    stability: stable
    requirement_level: recommended
    brief: Synthetic count.
    attributes:
      - ref: sample.state
