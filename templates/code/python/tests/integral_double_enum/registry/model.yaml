file_format: definition/2
attributes:
  - key: demo.sample
    stability: stable
    brief: Synthetic integral floating-point values.
    type:
      members:
        - id: single
          value: 1.0
          stability: stable
          brief: A floating-point value with no fractional part.
        - id: large
          value: 1.0e+3
          stability: stable
          brief: A floating-point value in scientific notation.
metrics:
  - name: demo.recorded
    requirement_level: recommended
    instrument: counter
    unit: "{record}"
    stability: stable
    brief: Synthetic records by floating-point enum.
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref: demo.sample
        requirement_level: required
      - ref: upstream.sample
        requirement_level: required
