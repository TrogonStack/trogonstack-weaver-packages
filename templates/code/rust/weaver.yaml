          then error("signal \(.id // .name) has a required attribute that becomes a reserved Rust parameter") else . end)
      | map(.optional = (.attributes | map(select(.requirement_level != "required"))))
      | map(if (.optional | any(.attr_short_name == "self" or .attr_short_name == "Self"))
          then error("signal \(.id // .name) has an optional attribute that becomes the reserved Rust Self identifier") else . end)
      | map(
          (.required
           | group_by(.attr_param | norm)
           | map(select(length > 1) | map(.key) | join(" and "))) as $required_collisions
          | (.optional
             | group_by(.attr_short_name | norm)
             | map(select(length > 1) | map(.key) | join(" and "))) as $optional_collisions
          | (.required | map(select(.attr_param | norm | . as $p | ["attributes", "options", "option"] | any(. == $p))) | map(.key)) as $shadowing
          | if ($required_collisions | length) > 0
            then error("entity \(.id) has required attributes that render to the same Rust parameter: \($required_collisions | join("; "))")
            elif ($optional_collisions | length) > 0
            then error("entity \(.id) has optional attributes that render to the same Rust identifier: \($optional_collisions | join("; "))")
            elif ($shadowing | length) > 0
            then error("entity \(.id) has required attributes whose Rust parameter would shadow a name its constructor declares: \($shadowing | join(", "))")
            else . end
        )
      | group_by(.namespace)
      | map(
          ([.[] | . as $def | .id as $entity | (.short_name | norm) as $short
            | (["P:new" + $short + "entity", "P:" + $short + "entity"]
               + (if ($def.optional | length) > 0 then ["P:" + $short + "entityattr"] else [] end)
               + ($def.optional | map(.attr_short_name | norm) | map("P:with" + $short + "entity" + ., "p:" + $short + "entity" + .)))[]
            | {identifier: ., name: $entity}]
           | group_by(.identifier)
           | map(select(length > 1) | map(.name) | unique | join(" and "))
           | unique) as $collisions
          | if ($collisions | length) > 0
            then error("package \(.[0].namespace)entity has entities that render to the same Rust identifier: \($collisions | join("; "))")
            else . end
        )
      | map({namespace: .[0].namespace, prefix: .[0].prefix, entities: sort_by(.id),
             uses_attributes: ([.[] | .attributes[]] | length > 0)})
    application_mode: each
    file_name: "{{ ctx.namespace }}entity.rs"

  - template: meter.rs.j2
