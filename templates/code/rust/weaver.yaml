    application_mode: each
    file_name: "{{ ctx.namespace }}span.rs"

  - template: events.rs.j2
    filter: |-
      def ns: if (test("^[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z][A-Za-z0-9_]*)*$") | not)
          then error("name \(.) is not a supported Rust signal identifier") else . end
        | split(".") as $s
        | if ($s | length) > 1 and ($vendor_prefixes | any(. == $s[0]))
          then {namespace: $s[1], prefix: ($s[0:2] | join(".")), short_name: ($s[2:] | join(".")), param: ($s[1:] | join("."))}
          else {namespace: $s[0], prefix: $s[0], short_name: ($s[1:] | join(".")), param: ($s | join("."))}
          end | if (.namespace | test("^[a-z][a-z0-9_]*$") | not)
          then error("namespace \(.namespace) is not a supported Rust module name") else . end;
      def enum_value_type($key):
        .members as $members
        | if ($members | length) == 0
          then error("attribute \($key) has no enum members left after exclude_deprecated or stable_only, so no value of it could be built")
          elif ($members | all(.value | type == "string")) then "string"
          elif ($members | all(.value | type == "boolean")) then "boolean"
          elif ($members | all(.value | type == "number" and . == floor)) then "int"
          elif ($members | all(.value | type == "number")) then "double"
          else error("attribute \($key) has enum members of more than one value type, which no single Rust type can hold")
          end;
      def norm: gsub("[._]"; "") | ascii_downcase;
      def kept($o):
        stability_filter($o) | code_generation_exclude_filter($o) | deprecated_filter($o)
        | map(.attributes = (if .attributes == null then .attributes else .attributes | stability_filter($o) | code_generation_exclude_filter($o) | deprecated_filter($o) end));
      def events($o):
        [.registry.events // [] | .[].name] as $bases
        | (.registry.events // [] | kept($o) | map(. + {id: .name}))
          + (.refinements.events // [] | map(select(.id as $id | $bases | any(. == $id) | not)) | kept($o));
      {v2: true, exclude_deprecated: $exclude_deprecated, stable_only: $stable_only} as $opts
      | (semconv_grouped_attributes($opts) | map(.attributes) | add // [] | map(.key)) as $rendered
      | (events({v2: true})
         | map({key: .id, value: [(.attributes // [])[] | select(.requirement_level == "required") | .key]})
         | from_entries) as $declared_required
      | events($opts)
      | map(.id as $event
            | (($declared_required[$event] // []) - [(.attributes // [])[] | .key]) as $dropped
            | if ($dropped | length) > 0
              then error("event \($event) requires \($dropped | join(", ")), which exclude_deprecated or stable_only leaves out, so its generated Emit function could not set them")
              else . end)
      | map(. + (.id | ns | {namespace, prefix, short_name}))
      | map(.id as $event
            | .attributes |= ((. // []) | sort_by(.key) | map(
                (.key | ns) as $attr_ns
                | if (.key as $k | $rendered | any(. == $k))
                  then . + {attr_namespace: $attr_ns.namespace, attr_short_name: $attr_ns.short_name, attr_param: $attr_ns.param}
                  elif ($imported_crate_paths | has($attr_ns.namespace))
                  then (if (.type | type) == "object" and (((.type.members // []) | length) == 0)
                        then error("event \($event) references imported attribute \(.key) whose enum has no members, so no value of it could be built")
                        elif (.type | type) != "object" and ([.type] | inside(["string", "string[]", "int", "int[]", "double", "double[]", "boolean", "boolean[]"]) | not)
                        then error("event \($event) references imported attribute \(.key) of type \(.type | tostring), which the Rust template does not render")
                        else . end
                        | . + {attr_namespace: $attr_ns.namespace, attr_short_name: $attr_ns.short_name, attr_param: $attr_ns.param,
                               attr_import_path: ($imported_crate_paths[$attr_ns.namespace] + "::" + $attr_ns.namespace + "attr")})
                  else . + {imported: true, attr_short_name: .key, attr_param: .key,
                            attr_type: (if (.type | type) == "object"
                                        then (.key as $key | .type | enum_value_type($key))
                                        elif ([.type] | inside(["string", "string[]", "int", "int[]", "double", "double[]", "boolean", "boolean[]"]))
                                        then .type
                                        else error("event \($event) references imported attribute \(.key) of type \(.type | tostring), which the Rust template does not render") end)}
                  end)))
      | map(.attributes |= map(. + {requirement_doc: (.requirement_level
            | if type == "object" and has("conditionally_required") then "Conditionally required: \(.conditionally_required)"
              elif type == "object" and has("recommended") then "Recommended: \(.recommended)"
              elif . == "opt_in" then "Opt-in: the convention records it only when a user asks for it."
              else null end)}))
      | map(.required = (.attributes | map(select(.requirement_level == "required"))))
      | map(if (.required | any(.attr_param == "self" or .attr_param == "Self" or .attr_param == "crate" or .attr_param == "super"))
          then error("signal \(.id // .name) has a required attribute that becomes a reserved Rust parameter") else . end)
      | map(.optional = (.attributes | map(select(.requirement_level != "required"))))
      | map(if (.optional | any(.attr_short_name == "self" or .attr_short_name == "Self"))
          then error("signal \(.id // .name) has an optional attribute that becomes the reserved Rust Self identifier") else . end)
      | map(
          (.required
           | group_by(.attr_param | norm)
           | map(select(length > 1) | map(.key) | join(" and "))) as $required_collisions
          | (.optional
             | group_by(.attr_short_name | norm)
             | map(select(length > 1) | map(.key) | join(" and "))) as $optional_collisions
          | (.optional | map(select(.attr_short_name | norm | . as $p | ["severity", "timestamp"] | any(. == $p))) | map(.key)) as $reserved
          | (.required | map(select(.attr_param | norm | . as $p | ["context", "logger", "options", "option", "record", "attributes", "severity", "timestamp"] | any(. == $p))) | map(.key)) as $shadowing
          | if ($required_collisions | length) > 0
            then error("event \(.id) has required attributes that render to the same Rust parameter: \($required_collisions | join("; "))")
            elif ($optional_collisions | length) > 0
            then error("event \(.id) has optional attributes that render to the same Rust identifier: \($optional_collisions | join("; "))")
            elif ($reserved | length) > 0
            then error("event \(.id) has optional attributes whose option would share a name with its severity or timestamp option: \($reserved | join(", "))")
            elif ($shadowing | length) > 0
            then error("event \(.id) has required attributes whose Rust parameter would shadow a name its Emit function declares: \($shadowing | join(", "))")
            else . end
        )
      | group_by(.namespace)
      | map(
          ([.[] | . as $def | .id as $event | (.short_name | norm) as $short
            | (["P:emit" + $short, "P:" + $short + "option",
                "P:with" + $short + "severity", "P:with" + $short + "timestamp",
                "p:" + $short + "option", "p:" + $short + "eventseverity", "p:" + $short + "eventtimestamp"]
               + ($def.optional | map(.attr_short_name | norm) | map("P:with" + $short + ., "p:" + $short + "event" + .)))[]
            | {identifier: ., name: $event}]
           | group_by(.identifier)
           | map(select(length > 1) | map(.name) | unique | join(" and "))
           | unique) as $collisions
          | if ($collisions | length) > 0
            then error("package \(.[0].namespace)event has events that render to the same Rust identifier: \($collisions | join("; "))")
            else . end
        )
      | map({namespace: .[0].namespace, prefix: .[0].prefix, events: sort_by(.id),
             uses_attributes: ([.[] | .attributes[] | select(.imported)] | length > 0)})
    application_mode: each
    file_name: "{{ ctx.namespace }}event.rs"

  - template: entities.rs.j2
    filter: |-
      def ns: if (test("^[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z][A-Za-z0-9_]*)*$") | not)
          then error("name \(.) is not a supported Rust signal identifier") else . end
        | split(".") as $s
        | if ($s | length) > 1 and ($vendor_prefixes | any(. == $s[0]))
          then {namespace: $s[1], prefix: ($s[0:2] | join(".")), short_name: ($s[2:] | join(".")), param: ($s[1:] | join("."))}
          else {namespace: $s[0], prefix: $s[0], short_name: ($s[1:] | join(".")), param: ($s | join("."))}
          end | if (.namespace | test("^[a-z][a-z0-9_]*$") | not)
          then error("namespace \(.namespace) is not a supported Rust module name") else . end;
      def enum_value_type($key):
        .members as $members
        | if ($members | length) == 0
          then error("attribute \($key) has no enum members left after exclude_deprecated or stable_only, so no value of it could be built")
          elif ($members | all(.value | type == "string")) then "string"
          elif ($members | all(.value | type == "boolean")) then "boolean"
          elif ($members | all(.value | type == "number" and . == floor)) then "int"
          elif ($members | all(.value | type == "number")) then "double"
          else error("attribute \($key) has enum members of more than one value type, which no single Rust type can hold")
          end;
      def norm: gsub("[._]"; "") | ascii_downcase;
      def kept($o):
        stability_filter($o) | code_generation_exclude_filter($o) | deprecated_filter($o)
        | map(.identity = (if .identity == null then .identity else .identity | stability_filter($o) | code_generation_exclude_filter($o) | deprecated_filter($o) end))
        | map(.description = (if .description == null then .description else .description | stability_filter($o) | code_generation_exclude_filter($o) | deprecated_filter($o) end));
      def entities($o):
        (.registry.entities // [] | kept($o) | map(. + {id: .type})) as $entities
        | ($entities | map(.type)) as $kept_bases
        | $entities + (.refinements.entities // [] | map(select(.id != .type)) | kept($o)
            | map(select(.type as $base | $kept_bases | any(. == $base)) | . + {refines: .type}));
      def resolved($entity; $rendered):
        (.key | ns) as $attr_ns
        | if (.key as $k | $rendered | any(. == $k))
          then . + {attr_namespace: $attr_ns.namespace, attr_short_name: $attr_ns.short_name, attr_param: $attr_ns.param}
          elif ($imported_crate_paths | has($attr_ns.namespace))
          then (if (.type | type) == "object" and (((.type.members // []) | length) == 0)
                then error("entity \($entity) references imported attribute \(.key) whose enum has no members, so no value of it could be built")
                elif (.type | type) != "object" and ([.type] | inside(["string", "string[]", "int", "int[]", "double", "double[]", "boolean", "boolean[]"]) | not)
                then error("entity \($entity) references imported attribute \(.key) of type \(.type | tostring), which the Rust template does not render")
                else . end
                | . + {attr_namespace: $attr_ns.namespace, attr_short_name: $attr_ns.short_name, attr_param: $attr_ns.param,
                       attr_import_path: ($imported_crate_paths[$attr_ns.namespace] + "::" + $attr_ns.namespace + "attr")})
          else . + {imported: true, attr_short_name: .key, attr_param: .key,
                    attr_type: (if (.type | type) == "object"
                                then (.key as $key | .type | enum_value_type($key))
                                elif ([.type] | inside(["string", "string[]", "int", "int[]", "double", "double[]", "boolean", "boolean[]"]))
                                then .type
                                else error("entity \($entity) references imported attribute \(.key) of type \(.type | tostring), which the Rust template does not render") end)}
          end;
      {v2: true, exclude_deprecated: $exclude_deprecated, stable_only: $stable_only} as $opts
      | (semconv_grouped_attributes($opts) | map(.attributes) | add // [] | map(.key)) as $rendered
      | (entities({v2: true})
         | map({key: .id, value: [((.identity // []) + (.description // []))[] | select(.requirement_level == "required") | .key]})
         | from_entries) as $declared_required
      | entities($opts)
      | map(.id as $entity
            | (($declared_required[$entity] // []) - [((.identity // []) + (.description // []))[] | .key]) as $dropped
            | if ($dropped | length) > 0
              then error("entity \($entity) requires \($dropped | join(", ")), which exclude_deprecated or stable_only leaves out, so its generated constructor could not set them")
              else . end)
      | map(. + (.id | ns | {namespace, prefix, short_name}))
      | map(.id as $entity
            | .identity = ((.identity // []) | sort_by(.key) | map(resolved($entity; $rendered)))
            | .description = ((.description // []) | sort_by(.key) | map(resolved($entity; $rendered)))
            | .attributes = (.identity + .description))
      | map(. + {identity_doc: (if (.identity | length) > 0 then "Identifies the entity: " + (.identity | map("`" + .key + "`") | join(", ")) + "." else null end),
                 description_doc: (if (.description | length) > 0 then "Describes the entity: " + (.description | map("`" + .key + "`") | join(", ")) + "." else null end)})
      | map(.attributes |= map(. + {requirement_doc: (.requirement_level
            | if type == "object" and has("conditionally_required") then "Conditionally required: \(.conditionally_required)"
              elif type == "object" and has("recommended") then "Recommended: \(.recommended)"
              elif . == "opt_in" then "Opt-in: the convention records it only when a user asks for it."
              else null end)}))
      | map(.required = (.attributes | map(select(.requirement_level == "required"))))
