file_format: definition/2
attributes:
  - key: myapp.task.id
    type: string
    stability: stable
    brief: Unique identifier of the task.
    examples: ["task_0001"]
  - key: myapp.queue.name
    type: string
    stability: stable
    brief: Name of the queue the task came from.
    examples: ["reports"]
spans:
  - type: myapp.task.run
    kind: internal
    name:
      note: An ID names a pattern the span does not have.
      templates:
        - "run {myapp.task.id}"
        - "run {myapp.queue.name}"
    annotations:
      code_generation:
        name_templates:
          by_task_id: "run {myapp.task.id}"
          by_queue: "run queue {myapp.queue.name}"
    requirement_level: recommended
    stability: stable
    brief: One run of a task.
    attributes:
      - ref: myapp.task.id
        requirement_level: required
      - ref: myapp.queue.name
        requirement_level: recommended
