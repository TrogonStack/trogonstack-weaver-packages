file_format: definition/2
attributes:
  - key: myapp.task.id
    type: string
    stability: stable
    brief: Unique identifier of the task.
    examples: ["task_0001"]
metrics:
  - name: myapp.task.failed
    instrument: counter
    unit: "{task}"
    stability: stable
    brief: Number of tasks that failed.
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref: myapp.task.id
        requirement_level: required
      - ref: error.type
        requirement_level: required
      - ref: server.port
        requirement_level: recommended
spans:
  - type: myapp.task.dispatch
    kind: internal
    requirement_level: recommended
    stability: stable
    brief: Dispatch of a task.
    name:
      note: "`task {myapp.task.id} failed with {error.type}`"
    attributes:
      - ref: myapp.task.id
        requirement_level: required
      - ref: error.type
        requirement_level: required
      - ref: server.port
        requirement_level: recommended
events:
  - name: myapp.task.errored
    requirement_level: recommended
    stability: stable
    brief: A task failed with an error.
    attributes:
      - ref: error.type
        requirement_level: required
      - ref: server.port
        requirement_level: recommended
