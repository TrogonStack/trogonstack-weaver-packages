file_format: definition/2
attributes:
  - key: myapp.task.id
    type: string
    stability: stable
    brief: Unique identifier of the task.
    examples: ["task_0001"]
metrics:
  - name: myapp.task.failed
    instrument: counter
    unit: "{task}"
    stability: stable
    brief: Number of tasks that failed.
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref: myapp.task.id
        requirement_level: required
      - ref: error.type
        requirement_level: required
      - ref: http.request.method_list
        requirement_level: recommended
  - name: edge.upstream.duration
    instrument: histogram
    unit: s
    stability: stable
    brief: Time spent waiting on an upstream server.
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref: server.address
        requirement_level: required
      - ref: server.port
        requirement_level: recommended
spans:
  - type: edge.upstream.request
    kind: client
    requirement_level: recommended
    stability: stable
    brief: A request to an upstream server.
    name:
      note: "`{server.address}:{server.port}`"
    attributes:
      - ref: server.address
        requirement_level: required
      - ref: server.port
        requirement_level: required
      - ref: error.type
        requirement_level:
          conditionally_required: If the request failed.
        sampling_relevant: true
      - ref: http.request.method_list
        requirement_level: recommended
  - type: edge.upstream.methods
    kind: client
    requirement_level: recommended
    stability: stable
    brief: A request named from attempted methods.
    name:
      note: "`{http.request.method_list}`"
    attributes:
      - ref: http.request.method_list
        requirement_level: required
events:
  - name: edge.upstream.failed
    requirement_level: recommended
    stability: stable
    brief: A request to an upstream server failed.
    attributes:
      - ref: error.type
        requirement_level: required
      - ref: server.address
        requirement_level: recommended
