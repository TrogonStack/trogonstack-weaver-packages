file_format: definition/2
attributes:
  - key: acme.billing.invoice.id
    type: string
    stability: stable
    brief: Identifier of the invoice.
    examples: ["inv_1"]
  - key: billing.currency
    type: string
    stability: stable
    brief: ISO 4217 currency code of the amount.
    examples: ["EUR"]
  - key: acme.billing.legacy_code
    type: string
    stability: development
    brief: Code used before invoices had identifiers.
    examples: ["X1"]
    deprecated:
      reason: renamed
      renamed_to: acme.billing.invoice.id
  - key: myapp.request.url
    type: string
    stability: stable
    brief: URL the request was sent to.
    examples: ["https://example.com/"]
metrics:
  - name: acme.billing.invoice.amount
    requirement_level: recommended
    instrument: histogram
    unit: "{currency_unit}"
    stability: stable
    brief: Amount of each issued invoice.
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref: acme.billing.invoice.id
        requirement_level: required
      - ref: billing.currency
        requirement_level: recommended
      - ref: myapp.request.url
        requirement_level: recommended
spans:
  - type: acme.billing.invoice.issue
    kind: internal
    stability: stable
    requirement_level: recommended
    brief: An invoice is being issued.
    name:
      note: "`invoice {acme.billing.invoice.id}`"
    attributes:
      - ref: acme.billing.invoice.id
        requirement_level: required
events:
  - name: acme.billing.invoice.issued
    stability: stable
    requirement_level: recommended
    brief: An invoice was issued.
    attributes:
      - ref: acme.billing.invoice.id
        requirement_level: required
