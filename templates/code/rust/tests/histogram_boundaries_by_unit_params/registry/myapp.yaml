file_format: definition/2
attributes:
  - key: myapp.task.id
    type: string
    stability: stable
    brief: Unique identifier of the task.
    examples: ["task_0001"]
metrics:
  - name: myapp.task.duration
    instrument: histogram
    unit: s
    stability: stable
    brief: Time a task took from start to finish.
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref: myapp.task.id
        requirement_level: required
  - name: myapp.task.queue_wait
    instrument: histogram
    unit: min
    stability: stable
    brief: Time a task waited in the queue, in minutes.
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref: myapp.task.id
        requirement_level: required
