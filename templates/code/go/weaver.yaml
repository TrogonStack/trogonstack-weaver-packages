        | (.registry.events // [] | kept($o) | map(. + {id: .name}))
          + (.refinements.events // [] | map(select(.id as $id | $bases | any(. == $id) | not)) | kept($o));
      {v2: true, exclude_deprecated: $exclude_deprecated, stable_only: $stable_only} as $opts
