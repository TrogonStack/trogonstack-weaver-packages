  # Spans follow the metric rules for attributes, requirement levels, and
  # identifier collisions. A span refinement becomes its own starter, named
  # from its id, generated only alongside the span it refines. Every attribute
  # is set when the span starts, since a sampler reads only those.
  # `name.note` is read only for a name template: a single code span with at
  # least one `{placeholder}`, each the key of an attribute the span requires.
  # Such a span is named from those attributes, and any other span takes a
  # typed name, since Go cannot check prose.
  # A span whose name has a single segment, such as a vendor-prefix-only name,
  # has nothing left after its namespace. Rather than failing, it renders
  # unprefixed: `Start`, `Span`, `Name`, and so on, in `<name>span`.
  - template: spans.go.j2
    filter: |-
      def ns: split(".") as $s
        | if ($s | length) > 1 and ($vendor_prefixes | any(. == $s[0]))
          then {namespace: $s[1], prefix: ($s[0:2] | join(".")), short_name: ($s[2:] | join(".")), param: ($s[1:] | join("."))}
          else {namespace: $s[0], prefix: $s[0], short_name: ($s[1:] | join(".")), param: ($s | join("."))}
          end;
      def enum_value_type($key):
        .members as $members
        | if ($members | length) == 0
          then error("attribute \($key) has no enum members left after exclude_deprecated or stable_only, so no value of it could be built")
          elif ($members | all(.value | type == "string")) then "string"
          elif ($members | all(.value | type == "boolean")) then "boolean"
          elif ($members | all(.value | type == "number" and . == floor)) then "int"
          elif ($members | all(.value | type == "number")) then "double"
          else error("attribute \($key) has enum members of more than one value type, which no single Go type can hold")
          end;
      def root: if ($root_package // "") != "" then $root_package
        else $import_path | sub("(/v[0-9]+(\\.[0-9]+)*)+/*$"; "") | split("/") | last end;
      def norm: gsub("[._]"; "") | ascii_downcase;
      def kept($o):
        stability_filter($o) | code_generation_exclude_filter($o) | deprecated_filter($o)
        | map(.attributes = (if .attributes == null then .attributes else .attributes | stability_filter($o) | code_generation_exclude_filter($o) | deprecated_filter($o) end));
      def spans($o):
        (.registry.spans // [] | kept($o) | map(. + {id: .type})) as $spans
        | ($spans | map(.type)) as $kept_bases
        | $spans + (.refinements.spans // [] | map(select(.id != .type)) | kept($o)
            | map(select(.type as $base | $kept_bases | any(. == $base)) | . + {refines: .type}));
      def name_parts:
        .required as $required
        | [(.name.note // "") | scan("`[^`]*`"; "g")] as $codes
        | if ($codes | length) != 1 then null
          else ($codes[0] | .[1:-1]) as $code
          | [$code | scan("\\{[^{}]*\\}"; "g") | .[1:-1]] as $keys
          | [$code | splits("\\{[^{}]*\\}")] as $texts
          | if ($keys | length) == 0
               or ($texts | any(test("[{}]")))
               or ($keys | any(. as $k | $required | any(.key == $k) | not))
            then null
            else [range(0; $keys | length) as $i | {text: $texts[$i]}, ($keys[$i] as $k | {attr: ($required | map(select(.key == $k)) | .[0])})]
                 + [{text: $texts[-1]}]
                 | map(select(.text != ""))
            end
          end;
      {v2: true, exclude_deprecated: $exclude_deprecated, stable_only: $stable_only} as $opts
      | (semconv_grouped_attributes($opts) | map(.attributes) | add // [] | map(.key)) as $rendered
      | (spans({v2: true})
         | map({key: .id, value: [(.attributes // [])[] | select(.requirement_level == "required") | .key]})
         | from_entries) as $declared_required
      | spans($opts)
      | map(.id as $span
            | (($declared_required[$span] // []) - [(.attributes // [])[] | .key]) as $dropped
            | if ($dropped | length) > 0
              then error("span \($span) requires \($dropped | join(", ")), which exclude_deprecated or stable_only leaves out, so its generated starter could not set them")
              else . end)
      | map(. + (.id | ns | {namespace, prefix, short_name}))
      | map(.id as $span
            | .attributes |= ((. // []) | sort_by(.key) | map(
                (.key | ns) as $attr_ns
                | if (.key as $k | $rendered | any(. == $k))
                  then . + {attr_namespace: $attr_ns.namespace, attr_short_name: $attr_ns.short_name, attr_param: $attr_ns.param}
                  elif ($imported_import_paths | has($attr_ns.namespace))
                  then (if (.type | type) == "object" and (((.type.members // []) | length) == 0)
                        then error("span \($span) references imported attribute \(.key) whose enum has no members, so no value of it could be built")
                        elif (.type | type) != "object" and ([.type] | inside(["string", "string[]", "int", "int[]", "double", "double[]", "boolean", "boolean[]"]) | not)
                        then error("span \($span) references imported attribute \(.key) of type \(.type | tostring), which the Go template does not render")
                        else . end
                        | . + {attr_namespace: $attr_ns.namespace, attr_short_name: $attr_ns.short_name, attr_param: $attr_ns.param,
                               attr_import_path: ($imported_import_paths[$attr_ns.namespace] + "/" + $attr_ns.namespace + "attr")})
                  else . + {imported: true, attr_short_name: .key, attr_param: .key,
                            attr_type: (if (.type | type) == "object"
                                        then (.key as $key | .type | enum_value_type($key))
                                        elif ([.type] | inside(["string", "string[]", "int", "int[]", "double", "double[]", "boolean", "boolean[]"]))
                                        then .type
                                        else error("span \($span) references imported attribute \(.key) of type \(.type | tostring), which the Go template does not render") end)}
                  end)))
      | map(.attributes |= map(. + {requirement_doc: (.requirement_level
            | if type == "object" and has("conditionally_required") then "Conditionally required: \(.conditionally_required)"
              elif type == "object" and has("recommended") then "Recommended: \(.recommended)"
              elif . == "opt_in" then "Opt-in: the convention records it only when a user asks for it."
              else null end)}))
      | map(.required = (.attributes | map(select(.requirement_level == "required"))))
      | map(.optional = (.attributes | map(select(.requirement_level != "required"))))
      | map(.has_late_attrs = (.optional | any(.sampling_relevant != true)))
      | map(.name_parts = name_parts)
      | map(.name_template = (if .name_parts then [.name.note | scan("`[^`]*`"; "g")][0][1:-1] else null end))
      | map(
          (.required
           | group_by(.attr_param | norm)
           | map(select(length > 1) | map(.key) | join(" and "))) as $required_collisions
          | (.optional
             | group_by(.attr_short_name | norm)
             | map(select(length > 1) | map(.key) | join(" and "))) as $optional_collisions
          | (.required | map(select(.attr_param | norm | . as $p | ["ctx", "tracer", "name", "opts", "opt", "kvs", "span"] | any(. == $p))) | map(.key)) as $shadowing
          | if ($required_collisions | length) > 0
            then error("span \(.id) has required attributes that render to the same Go parameter: \($required_collisions | join("; "))")
            elif ($optional_collisions | length) > 0
            then error("span \(.id) has optional attributes that render to the same Go identifier: \($optional_collisions | join("; "))")
            elif ($shadowing | length) > 0
            then error("span \(.id) has required attributes whose Go parameter would shadow a name its starter declares: \($shadowing | join(", "))")
            else . end
        )
      | group_by(.namespace)
      | map(
          ([.[] | . as $def | .id as $span | (.short_name | norm) as $short
            | (["P:start" + $short, "P:" + $short + "span"]
               + (if $def.name_parts then [] else ["P:" + $short + "name", "P:new" + $short + "name"] end)
               + (if ($def.optional | length) > 0 then ["P:" + $short + "startattr"] else [] end)
               + (if $def.has_late_attrs then ["P:" + $short + "attr"] else [] end)
               + ($def.optional | map(.attr_short_name | norm) | map("P:with" + $short + ., "p:" + $short + "span" + .)))[]
            | {identifier: ., name: $span}]
           | group_by(.identifier)
           | map(select(length > 1) | map(.name) | unique | join(" and "))
           | unique) as $collisions
          | if ($collisions | length) > 0
            then error("package \(.[0].namespace)span has spans that render to the same Go identifier: \($collisions | join("; "))")
            else . end
        )
      | map({namespace: .[0].namespace, prefix: .[0].prefix, spans: sort_by(.id),
             uses_attributes: ([.[] | .attributes[]] | length > 0),
             imports: (
               .[0].namespace as $pkg
               | (([.[] | .attributes[] | select(.imported | not)
                     | {name: (.attr_namespace + "attr"), path: (.attr_import_path // ($import_path + "/" + .attr_namespace + "attr"))}]
                   + [{name: (root + "tracer"), path: ($import_path + "/" + root + "tracer")}])
                  | unique) as $imports
               | ($imports | group_by(.name) | map(select((map(.path) | unique | length) > 1))) as $collisions
               | if ($collisions | length) > 0
                 then error("package \($pkg)span would import " + ($collisions | map(.[0].name + " from both " + (map(.path) | unique | join(" and "))) | join("; ")))
                 else ($imports | sort_by(.path)) end
             )})
    application_mode: each
    file_name: "{{ ctx.namespace }}span/spans.go"

  # Events follow the span rules for attributes, requirement levels, and
  # identifier collisions. An event refinement becomes its own Emit function,
  # named from its id. Weaver resolves a refinement's event name to its id and
  # keeps no link to the event it refines, so it is emitted under its id and
  # generated on its own stability and deprecation. Severity and
  # timestamp share the event's option type, so an attribute that would render
  # to either name fails.
  # An event whose name has a single segment, such as the upstream `exception`
  # event, has nothing left after its namespace. Rather than failing, it
  # renders unprefixed: `Emit`, `Option`, `WithSeverity`, and so on, in
  # `<name>event`. A metric keeps erroring on a single-segment name: a bare
  # `Counter` or `Histogram` reads too close to the OpenTelemetry metric API
  # types it wraps, and semantic convention metric names always carry a
  # namespace in practice, unlike span and event names.
  - template: events.go.j2
