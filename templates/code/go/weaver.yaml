                   + [{name: (root + "logger"), path: ($import_path + "/" + root + "logger")}])
                  | unique) as $imports
               | ($imports | group_by(.name) | map(select((map(.path) | unique | length) > 1))) as $collisions
               | if ($collisions | length) > 0
                 then error("package \($pkg)event would import " + ($collisions | map(.[0].name + " from both " + (map(.path) | unique | join(" and "))) | join("; ")))
                 else ($imports | sort_by(.path)) end
             )})
    application_mode: each
    file_name: "{{ ctx.namespace }}event/events.go"

  # Entities follow the span rules for attributes, requirement levels, and
  # identifier collisions, but keep identity and description attributes in
  # two separate lists instead of sorting by key, so the generated doc and
  # parameter order shows which attributes identify the entity and which
  # describe it. An entity refinement becomes its own value type, named from
  # its id, generated only alongside the entity it refines; unlike an event
  # refinement, weaver keeps the link to the base entity's type.
  # The type's only state is the attribute.KeyValue slice its constructor
  # built, exposed through Attributes and, tied to the registry's schema,
  # through Resource.
  - template: entities.go.j2
    filter: |-
      def ns: split(".") as $s
        | if ($s | length) > 1 and ($vendor_prefixes | any(. == $s[0]))
          then {namespace: $s[1], prefix: ($s[0:2] | join(".")), short_name: ($s[2:] | join(".")), param: ($s[1:] | join("."))}
          else {namespace: $s[0], prefix: $s[0], short_name: ($s[1:] | join(".")), param: ($s | join("."))}
          end;
      def enum_value_type($key):
        .members as $members
        | if ($members | length) == 0
          then error("attribute \($key) has no enum members left after exclude_deprecated or stable_only, so no value of it could be built")
          elif ($members | all(.value | type == "string")) then "string"
          elif ($members | all(.value | type == "boolean")) then "boolean"
          elif ($members | all(.value | type == "number" and . == floor)) then "int"
          elif ($members | all(.value | type == "number")) then "double"
          else error("attribute \($key) has enum members of more than one value type, which no single Go type can hold")
          end;
      def root: if ($root_package // "") != "" then $root_package
        else $import_path | sub("(/v[0-9]+(\\.[0-9]+)*)+/*$"; "") | split("/") | last end;
      def norm: gsub("[._]"; "") | ascii_downcase;
      def kept($o):
        stability_filter($o) | code_generation_exclude_filter($o) | deprecated_filter($o)
        | map(.identity = (if .identity == null then .identity else .identity | stability_filter($o) | code_generation_exclude_filter($o) | deprecated_filter($o) end))
        | map(.description = (if .description == null then .description else .description | stability_filter($o) | code_generation_exclude_filter($o) | deprecated_filter($o) end));
      def entities($o):
        (.registry.entities // [] | kept($o) | map(. + {id: .type})) as $entities
        | ($entities | map(.type)) as $kept_bases
        | $entities + (.refinements.entities // [] | map(select(.id != .type)) | kept($o)
            | map(select(.type as $base | $kept_bases | any(. == $base)) | . + {refines: .type}));
      def resolved($entity; $rendered):
        (.key | ns) as $attr_ns
        | if (.key as $k | $rendered | any(. == $k))
          then . + {attr_namespace: $attr_ns.namespace, attr_short_name: $attr_ns.short_name, attr_param: $attr_ns.param}
          elif ($imported_import_paths | has($attr_ns.namespace))
          then (if (.type | type) == "object" and (((.type.members // []) | length) == 0)
                then error("entity \($entity) references imported attribute \(.key) whose enum has no members, so no value of it could be built")
                elif (.type | type) != "object" and ([.type] | inside(["string", "string[]", "int", "int[]", "double", "double[]", "boolean", "boolean[]"]) | not)
                then error("entity \($entity) references imported attribute \(.key) of type \(.type | tostring), which the Go template does not render")
                else . end
                | . + {attr_namespace: $attr_ns.namespace, attr_short_name: $attr_ns.short_name, attr_param: $attr_ns.param,
                       attr_import_path: ($imported_import_paths[$attr_ns.namespace] + "/" + $attr_ns.namespace + "attr")})
          else . + {imported: true, attr_short_name: .key, attr_param: .key,
                    attr_type: (if (.type | type) == "object"
                                then (.key as $key | .type | enum_value_type($key))
                                elif ([.type] | inside(["string", "string[]", "int", "int[]", "double", "double[]", "boolean", "boolean[]"]))
                                then .type
                                else error("entity \($entity) references imported attribute \(.key) of type \(.type | tostring), which the Go template does not render") end)}
          end;
      {v2: true, exclude_deprecated: $exclude_deprecated, stable_only: $stable_only} as $opts
      | (semconv_grouped_attributes($opts) | map(.attributes) | add // [] | map(.key)) as $rendered
      | (entities({v2: true})
         | map({key: .id, value: [((.identity // []) + (.description // []))[] | select(.requirement_level == "required") | .key]})
         | from_entries) as $declared_required
      | entities($opts)
      | map(.id as $entity
            | (($declared_required[$entity] // []) - [((.identity // []) + (.description // []))[] | .key]) as $dropped
            | if ($dropped | length) > 0
              then error("entity \($entity) requires \($dropped | join(", ")), which exclude_deprecated or stable_only leaves out, so its generated constructor could not set them")
              else . end)
      | map(. + (.id | ns | {namespace, prefix, short_name}))
      | map(.id as $entity
            | .identity = ((.identity // []) | sort_by(.key) | map(resolved($entity; $rendered)))
            | .description = ((.description // []) | sort_by(.key) | map(resolved($entity; $rendered)))
            | .attributes = (.identity + .description))
      | map(. + {identity_doc: (if (.identity | length) > 0 then "Identifies the entity: " + (.identity | map("`" + .key + "`") | join(", ")) + "." else null end),
                 description_doc: (if (.description | length) > 0 then "Describes the entity: " + (.description | map("`" + .key + "`") | join(", ")) + "." else null end)})
      | map(.attributes |= map(. + {requirement_doc: (.requirement_level
            | if type == "object" and has("conditionally_required") then "Conditionally required: \(.conditionally_required)"
              elif type == "object" and has("recommended") then "Recommended: \(.recommended)"
              elif . == "opt_in" then "Opt-in: the convention records it only when a user asks for it."
              else null end)}))
      | map(.required = (.attributes | map(select(.requirement_level == "required"))))
      | map(.optional = (.attributes | map(select(.requirement_level != "required"))))
      | map(
          (.required
           | group_by(.attr_param | norm)
           | map(select(length > 1) | map(.key) | join(" and "))) as $required_collisions
          | (.optional
             | group_by(.attr_short_name | norm)
             | map(select(length > 1) | map(.key) | join(" and "))) as $optional_collisions
          | (.required | map(select(.attr_param | norm | . as $p | ["attrs", "opts", "opt"] | any(. == $p))) | map(.key)) as $shadowing
          | if ($required_collisions | length) > 0
            then error("entity \(.id) has required attributes that render to the same Go parameter: \($required_collisions | join("; "))")
            elif ($optional_collisions | length) > 0
            then error("entity \(.id) has optional attributes that render to the same Go identifier: \($optional_collisions | join("; "))")
            elif ($shadowing | length) > 0
            then error("entity \(.id) has required attributes whose Go parameter would shadow a name its constructor declares: \($shadowing | join(", "))")
            else . end
        )
      | group_by(.namespace)
      | map(
          ([.[] | . as $def | .id as $entity | (.short_name | norm) as $short
            | (["P:new" + $short + "entity", "P:" + $short + "entity"]
               + (if ($def.optional | length) > 0 then ["P:" + $short + "entityattr"] else [] end)
               + ($def.optional | map(.attr_short_name | norm) | map("P:with" + $short + "entity" + ., "p:" + $short + "entity" + .)))[]
            | {identifier: ., name: $entity}]
           | group_by(.identifier)
           | map(select(length > 1) | map(.name) | unique | join(" and "))
           | unique) as $collisions
          | if ($collisions | length) > 0
            then error("package \(.[0].namespace)entity has entities that render to the same Go identifier: \($collisions | join("; "))")
            else . end
        )
      | map({namespace: .[0].namespace, prefix: .[0].prefix, entities: sort_by(.id),
             uses_attributes: ([.[] | .attributes[]] | length > 0),
             root_import_path: $import_path,
             imports: (
               .[0].namespace as $pkg
               | (([.[] | .attributes[] | select(.imported | not)
                     | {name: (.attr_namespace + "attr"), path: (.attr_import_path // ($import_path + "/" + .attr_namespace + "attr"))}])
                  | unique) as $imports
               | (($imports + [{name: root, path: $import_path}]) | group_by(.name) | map(select((map(.path) | unique | length) > 1))) as $collisions
               | if ($collisions | length) > 0
                 then error("package \($pkg)entity would import " + ($collisions | map(.[0].name + " from both " + (map(.path) | unique | join(" and "))) | join("; ")))
                 else ($imports | sort_by(.path)) end
             )})
    application_mode: each
    file_name: "{{ ctx.namespace }}entity/entities.go"

# Weaver's word wrap can start a line with the punctuation or space that
# follows an inline code span, so every template rejoins those lines.
comment_formats:
  go:
    format: markdown
    prefix: "// "
    trim: true
    word_wrap:
      line_length: 76
  go_indented:
    format: markdown
    prefix: "\t// "
    trim: true
    word_wrap:
      line_length: 72
default_comment_format: go

text_maps:
  # Registry type to the attribute.Key method that builds a KeyValue, the Go
  # type a constructor accepts, and the Go type a value stores.
  attribute_type_method:
    string: String
    string[]: StringSlice
    int: Int
    int[]: IntSlice
    double: Float64
    double[]: Float64Slice
    boolean: Bool
    boolean[]: BoolSlice
  attribute_type_value:
    string: string
    string[]: "...string"
    int: int
    int[]: "...int"
    double: float64
    double[]: "...float64"
    boolean: bool
    boolean[]: "...bool"
  attribute_field_type:
    string: string
    string[]: "[]string"
    int: int
    int[]: "[]int"
    double: float64
    double[]: "[]float64"
    boolean: bool
    boolean[]: "[]bool"
  # Registry instrument to the suffix of the otel constructor name. The prefix
  # comes from the metric's `code_generation.metric_value_type` annotation.
  metric_instrument:
    counter: Counter
    updowncounter: UpDownCounter
    histogram: Histogram
    gauge: Gauge
  metric_instrument_method:
    counter: Add
    updowncounter: Add
    histogram: Record
    gauge: Record
  metric_instrument_arg:
    counter: incr
    updowncounter: incr
    histogram: value
    gauge: value
  metric_value_type:
    int: Int64
    double: Float64
  span_kind:
    internal: SpanKindInternal
    server: SpanKindServer
    client: SpanKindClient
    producer: SpanKindProducer
    consumer: SpanKindConsumer

# Words kept upper case when a name segment becomes part of a Go identifier.
acronyms:
  - API
  - CPU
  - DB
  - DNS
  - HTTP
  - ID
  - IP
  - JSON
  - RPC
  - SQL
  - TCP
  - TLS
  - UDP
  - URI
  - URL
  - UUID
