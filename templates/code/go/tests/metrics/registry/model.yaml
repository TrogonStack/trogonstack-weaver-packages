file_format: definition/2
attributes:
  - key: myapp.task.id
    type: string
    stability: stable
    brief: Unique identifier of the task.
    examples: ["task_0001"]
  - key: myapp.task.state
    type:
      members:
        - id: queued
          value: queued
          stability: stable
          brief: The task is waiting to run.
        - id: done
          value: done
          stability: stable
          brief: The task finished.
    stability: stable
    brief: Current state of the task.
  - key: auth.method
    type:
      members:
        - id: password
          value: password
          stability: stable
          brief: A password was checked.
        - id: token
          value: token
          stability: stable
          brief: A bearer token was checked.
    stability: stable
    brief: How the user was authenticated.
  - key: auth.success
    type: boolean
    stability: stable
    brief: Whether the attempt succeeded.
    examples: true
metrics:
  - name: myapp.task.duration
    requirement_level: recommended
    instrument: histogram
    unit: s
    stability: stable
    brief: Time a task took from start to finish.
    note: Measured by the worker that ran the task.
    annotations:
      go:
        value_type: float64
    attributes:
      - ref: myapp.task.id
        requirement_level: required
      - ref: myapp.task.state
        requirement_level: recommended
      - ref: auth.method
        requirement_level: opt_in
  - name: myapp.task.started
    requirement_level: recommended
    instrument: counter
    unit: "{task}"
    stability: stable
    brief: Number of tasks started.
    annotations:
      go:
        value_type: int64
  - name: myapp.task.active
    requirement_level: recommended
    instrument: updowncounter
    unit: "{task}"
    stability: development
    brief: Number of tasks currently running.
    annotations:
      go:
        value_type: int64
    attributes:
      - ref: myapp.task.state
        requirement_level: required
  - name: myapp.queue.depth
    requirement_level: recommended
    instrument: gauge
    unit: "{task}"
    stability: development
    brief: Number of tasks waiting in the queue.
    annotations:
      go:
        value_type: int64
    deprecated:
      reason: renamed
      renamed_to: myapp.task.active
  - name: auth.attempts
    requirement_level: recommended
    instrument: counter
    unit: "{attempt}"
    stability: stable
    brief: Number of authentication attempts.
    annotations:
      go:
        value_type: int64
    attributes:
      - ref: auth.method
        requirement_level: required
      - ref: auth.success
        requirement_level: required
