file_format: definition/2
attributes:
  - key: myapp.task.id
    type: string
    stability: development
    brief: Unique identifier of the task.
    examples: ["task_0001"]
metrics:
  - name: myapp.task.started
    requirement_level: recommended
    instrument: counter
    unit: "{task}"
    stability: stable
    brief: Number of tasks started.
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref: myapp.task.id
        requirement_level: required
