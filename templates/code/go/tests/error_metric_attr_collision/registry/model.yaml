file_format: definition/2
attributes:
  - key: myapp.task.id
    type: string
    stability: stable
    brief: Unique identifier of the task.
    examples: ["task_0001"]
metrics:
  - name: myapp.task.duration
    instrument: histogram
    unit: s
    stability: stable
    brief: Time a task took.
    attributes:
      - ref: myapp.task.id
        requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: double
  - name: myapp.task.duration.attr
    instrument: counter
    unit: "{task}"
    stability: stable
    brief: A metric whose type shares the name of another metric's attribute option.
    annotations:
      code_generation:
        metric_value_type: int
