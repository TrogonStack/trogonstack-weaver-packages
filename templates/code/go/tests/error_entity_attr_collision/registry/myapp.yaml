file_format: definition/2
attributes:
  - key: myapp.host.id
    type: string
    stability: stable
    brief: Unique identifier of the host.
    examples: ["h-1"]
  - key: myapp.host.type
    type: string
    stability: stable
    brief: Type of the host.
    examples: ["vm"]
entities:
  - type: myapp.host
    requirement_level: recommended
    stability: stable
    brief: A host.
    identity:
      - ref: myapp.host.id
        requirement_level: required
    description:
      - ref: myapp.host.type
        requirement_level: recommended
  - type: myapp.host.attr
    requirement_level: recommended
    stability: stable
    brief: An entity whose type shares the name of another entity's option type.
    identity:
      - ref: myapp.host.id
        requirement_level: required
