file_format: definition/2
attributes:
  - key: myapp.task.id
    type: string
    stability: stable
    brief: Unique identifier of the task.
    examples: ["task_0001"]
    deprecated:
      reason: uncategorized
      note: Tasks are no longer identified.
metrics:
  - name: myapp.task.started
    requirement_level: recommended
    instrument: counter
    unit: "{task}"
    stability: stable
    brief: Number of tasks started.
    annotations:
      go:
        value_type: int64
    attributes:
      - ref: myapp.task.id
        requirement_level: required
