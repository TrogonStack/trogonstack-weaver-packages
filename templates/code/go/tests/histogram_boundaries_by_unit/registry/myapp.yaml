file_format: definition/2
attributes:
  - key: myapp.task.id
    type: string
    stability: stable
    brief: Unique identifier of the task.
    examples: ["task_0001"]
metrics:
  - name: myapp.task.duration
    instrument: histogram
    unit: s
    stability: stable
    brief: Time a task took from start to finish.
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref: myapp.task.id
        requirement_level: required
  - name: myapp.task.latency
    instrument: histogram
    unit: s
    stability: stable
    brief: Time between a task being queued and started.
    annotations:
      code_generation:
        metric_value_type: double
      aggregation:
        method: explicithistogram
        parameters:
          boundaries: [1, 10, 100]
    attributes:
      - ref: myapp.task.id
        requirement_level: required
  - name: myapp.task.size
    instrument: histogram
    unit: By
    stability: stable
    brief: Size of a task's payload.
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref: myapp.task.id
        requirement_level: required
metric_refinements:
  - id: myapp.task.retry.duration
    ref: myapp.task.duration
    stability: stable
    brief: Time a retried task took from start to finish.
    attributes:
      - ref: myapp.task.id
        requirement_level: required
