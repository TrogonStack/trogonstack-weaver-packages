file_format: definition/2
attributes:
  - key: myapp.task.state
    type: string
    stability: stable
    brief: Current state of the task.
metrics:
  - name: myapp.task.started
    instrument: counter
    unit: "{task}"
    stability: stable
    brief: Number of tasks started.
    attributes:
      - ref: myapp.task.state
        requirement_level: required
    annotations:
      code_generation:
        metric_value_type: int
