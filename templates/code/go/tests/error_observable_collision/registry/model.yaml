file_format: definition/2
metrics:
  - name: myapp.task.started
    instrument: counter
    unit: "{task}"
    stability: stable
    brief: Number of tasks started.
    annotations:
      code_generation:
        metric_value_type: int
  - name: myapp.task.started.observable
    instrument: counter
    unit: "{task}"
    stability: stable
    brief: Number of tasks started, observed.
    annotations:
      code_generation:
        metric_value_type: int
