file_format: definition/2
attributes:
  - key: myapp.task.id
    type: string
    stability: stable
    brief: Unique identifier of the task.
    examples: ["task_0001"]
  - key: tenant
    type: string
    stability: stable
    brief: Tenant the request belongs to.
    examples: ["t1"]
metrics:
  - name: requests
    instrument: counter
    unit: "{request}"
    stability: stable
    requirement_level: recommended
    brief: Number of requests handled.
    annotations:
      code_generation:
        metric_value_type: int
spans:
  - type: work
    kind: internal
    requirement_level: recommended
    stability: stable
    brief: A unit of work.
    name:
      note: ""
events:
  - name: finished
    requirement_level: recommended
    stability: stable
    brief: A unit of work finished.
