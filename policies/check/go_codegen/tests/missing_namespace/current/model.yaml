file_format: definition/2
attributes:
  - key: myapp.task.id
    type: string
    stability: stable
    brief: Unique identifier of the task.
    examples: ["task_0001"]
  - key: tenant
    type: string
    stability: stable
    brief: Tenant the request belongs to.
    examples: ["t1"]
metrics:
  - name: requests
    instrument: counter
    unit: "{request}"
    stability: stable
    requirement_level: recommended
    brief: Number of requests handled.
    annotations:
      go:
        value_type: int64
