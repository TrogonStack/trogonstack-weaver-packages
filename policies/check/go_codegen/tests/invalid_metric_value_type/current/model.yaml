file_format: definition/2
metrics:
  - name: myapp.task.duration
    instrument: histogram
    unit: s
    stability: stable
    requirement_level: recommended
    brief: Time a task took from start to finish.
  - name: auth.attempts
    instrument: counter
    unit: "{attempt}"
    stability: stable
    requirement_level: recommended
    brief: Number of authentication attempts.
    annotations:
      code_generation:
        metric_value_type: long
  - name: myapp.task.started
    instrument: counter
    unit: "{task}"
    stability: stable
    requirement_level: recommended
    brief: Number of tasks started.
    annotations:
      code_generation:
        metric_value_type: int
